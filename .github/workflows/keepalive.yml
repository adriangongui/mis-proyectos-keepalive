name: Supabase Keep-Alive

on:
  schedule:
    # Primary: every day at 8:00 AM UTC
    - cron: "0 8 * * *"
    # Backup: every day at 8:00 PM UTC (in case morning run gets skipped)
    - cron: "0 20 * * *"
  workflow_dispatch: # Manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Ping all Supabase projects
        env:
          SUPABASE_PROJECTS: ${{ secrets.SUPABASE_PROJECTS }}
        run: node ping.js